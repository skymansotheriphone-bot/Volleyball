<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volleyball Scorebug Overlay</title>
<script src="https://unpkg.com"></script>
<style>
  @import url('https://googleapis.com');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  body { background: transparent; overflow: hidden; padding: 24px; }

  .scorebug {
    display: inline-flex; flex-direction: column;
    background: rgba(15, 20, 30, 0.94);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.65);
    border: 1px solid rgba(255,255,255,0.18);
    min-width: 390px;
  }
  .bug-header {
    background: #090d16; color: #94a3b8;
    font-size: 11px; font-weight: 800; letter-spacing: 1.5px;
    padding: 5px 14px; display: flex; justify-content: space-between;
    text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .team-row {
    display: flex; align-items: center; height: 48px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .team-row:last-child { border-bottom: none; }
  .color-bar { width: 8px; height: 100%; }
  .team-name {
    flex: 1; color: #ffffff; font-size: 18px; font-weight: 800;
    padding: 0 12px; letter-spacing: 0.5px; text-transform: uppercase;
    white-space: nowrap;
  }
  .serve-icon { width: 28px; display: flex; justify-content: center; align-items: center; opacity: 0; }
  .serve-icon.active { opacity: 1; }
  .vb-ball {
    width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fde047, #eab308);
    box-shadow: 0 0 8px rgba(250, 204, 21, 0.8);
  }
  .prev-sets { display: flex; gap: 6px; padding-right: 10px; }
  .set-pill {
    background: rgba(255,255,255,0.08); color: #94a3b8;
    font-size: 13px; font-weight: 700; width: 26px; height: 26px;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
  }
  .set-pill.won { background: rgba(34, 197, 94, 0.25); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.4); }
  .sets-won {
    width: 38px; height: 100%; background: rgba(0,0,0,0.45);
    color: #facc15; font-size: 19px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    border-left: 1px solid rgba(255,255,255,0.1);
  }
  .current-score {
    width: 56px; height: 100%; background: #ffffff; color: #0f172a;
    font-size: 24px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
  <div class="scorebug">
    <div class="bug-header">
      <span id="ov-match-title">CLUB VOLLEYBALL • BEST OF 3</span>
      <span id="ov-set-label">SET 1 (TO 25)</span>
    </div>
    <div class="team-row">
      <div class="color-bar" id="ov-color-a" style="background: #3b82f6;"></div>
      <div class="team-name" id="ov-name-a">HOME TEAM</div>
      <div class="serve-icon active" id="ov-serve-a"><div class="vb-ball"></div></div>
      <div class="prev-sets" id="ov-prev-a"></div>
      <div class="sets-won" id="ov-sets-a">0</div>
      <div class="current-score" id="ov-score-a">0</div>
    </div>
    <div class="team-row">
      <div class="color-bar" id="ov-color-b" style="background: #ef4444;"></div>
      <div class="team-name" id="ov-name-b">AWAY TEAM</div>
      <div class="serve-icon" id="ov-serve-b"><div class="vb-ball"></div></div>
      <div class="prev-sets" id="ov-prev-b"></div>
      <div class="sets-won" id="ov-sets-b">0</div>
      <div class="current-score" id="ov-score-b">0</div>
    </div>
  </div>

<script>
  const room = new URLSearchParams(window.location.search).get('room') || 'skymanvb26';
  const peer = new Peer('vb-overlay-' + room);

  peer.on('connection', (conn) => {
    conn.on('data', (s) => {
      document.getElementById('ov-match-title').textContent = s.title;
      document.getElementById('ov-name-a').textContent = s.nameA || 'TEAM A';
      document.getElementById('ov-color-a').style.background = s.colorA;
      document.getElementById('ov-score-a').textContent = s.scoreA;

      document.getElementById('ov-name-b').textContent = s.nameB || 'TEAM B';
      document.getElementById('ov-color-b').style.background = s.colorB;
      document.getElementById('ov-score-b').textContent = s.scoreB;

      document.getElementById('ov-serve-a').classList.toggle('active', s.serve === 'a');
      document.getElementById('ov-serve-b').classList.toggle('active', s.serve === 'b');

      let setsA = 0, setsB = 0, htmlA = '', htmlB = '';
      s.completedSets.forEach(set => {
        const aWon = set.a > set.b;
        if (aWon) setsA++; else setsB++;
        htmlA += `<div class="set-pill ${aWon ? 'won' : ''}">${set.a}</div>`;
        htmlB += `<div class="set-pill ${!aWon ? 'won' : ''}">${set.b}</div>`;
      });

      document.getElementById('ov-prev-a').innerHTML = htmlA;
      document.getElementById('ov-prev-b').innerHTML = htmlB;
      document.getElementById('ov-sets-a').textContent = setsA;
      document.getElementById('ov-sets-b').textContent = setsB;

      const setNum = Math.min(3, s.completedSets.length + 1);
      document.getElementById('ov-set-label').textContent = `SET ${setNum}${setNum === 3 ? ' (TO 15)' : ' (TO 25)'}`;
    });
  });
</script>
</body>
</html>
